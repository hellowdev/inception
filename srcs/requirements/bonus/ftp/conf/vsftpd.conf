# vsftpd.conf

listen=YES
listen_ipv6=NO

# Anonymous access
anonymous_enable=YES
local_enable=NO
write_enable=YES
anon_upload_enable=YES
anon_mkdir_write_enable=YES
anon_root=/var/www/html/

# Passive mode (required for Docker)
pasv_enable=YES
pasv_min_port=21000
pasv_max_port=21010

# Security
chroot_local_user=YES
secure_chroot_dir=/var/run/vsftpd/empty